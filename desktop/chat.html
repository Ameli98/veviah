<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>VEviaH</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --ink: #1f2933; --dim: #616e7c; --line: #e4e7eb; --acc: #3b6fd8; --me: #dbe7fb; --err: #d64545; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1f24; --card: #262a31; --ink: #e8eaed; --dim: #9aa5b1; --line: #343a43; --acc: #7aa2f7; --me: #2c3b57; --err: #ef7070; } }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px "Microsoft JhengHei", "Yu Gothic UI", system-ui, sans-serif; }
    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .m { max-width: 82%; padding: 7px 11px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
    .her { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .err { align-self: center; color: var(--err); font-size: 12px; text-align: center; max-width: 92%; }
    .note { align-self: center; color: var(--dim); font-size: 12px; }
    .wait { color: var(--dim); }
    #bar { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); background: var(--card); }
    textarea { flex: 1; resize: none; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); height: 40px; }
    button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
    button.main { background: var(--acc); border-color: var(--acc); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    #foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 10px 8px; background: var(--card); font-size: 12px; color: var(--dim); }
    #foot button { padding: 2px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="log"></div>
  <div id="bar"><textarea id="in"></textarea><button class="main" id="send"></button></div>
  <div id="foot"><span id="cost"></span><span><button id="setup"></button> <button id="clear"></button></span></div>
  <script>
    const $ = (id) => document.getElementById(id);
    let T = {}, session = {};
    const add = (cls, text) => { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text; $('log').appendChild(d); $('log').scrollTop = 1e9; return d; };
    const herText = (tn) => (tn.lines?.length ? tn.lines.map((l) => l.subtitle || l.say).join('\n') : tn.reply);
    function costLine() {
      const tok = Math.round(((session.in ?? 0) + (session.out ?? 0)) / 1000);
      const usd = session.cost ?? 0;
      $('cost').textContent = session.costKnown === false ? T.chatTokens.replace('{k}', tok)
        : T.chatCost.replace('{usd}', usd < 0.01 && usd > 0 ? usd.toFixed(4) : usd.toFixed(2)).replace('{k}', tok);
    }
    async function load() {
      const s = await hsinChat.state();
      T = s.t; session = s.history.session ?? {};
      document.title = T.chatTitle; $('send').textContent = T.chatSend; $('clear').textContent = T.chatClear; $('setup').textContent = T.chatSetup;
      $('in').placeholder = T.chatPlaceholder;
      $('log').innerHTML = '';
      if (s.history.summarized) add('note', T.chatSummarized);
      for (const tn of s.history.turns ?? []) { add('me', tn.user); add('her', herText(tn) || '…'); }
      if (!s.view.ready) add('err', T.chatErr.setup);
      costLine();
    }
    async function send() {
      const text = $('in').value.trim();
      if (!text || $('send').disabled) return;
      $('in').value = ''; $('send').disabled = true;
      add('me', text);
      const w = add('her wait', '…');
      try {
        const r = await hsinChat.send(text);
        if (r.error) { w.remove(); add('err', (T.chatErr[r.error] ?? T.chatErr.other) + (r.message && r.error === 'other' ? `\n${r.message}` : '')); }
        else { w.className = 'm her'; w.textContent = herText(r.turn) || '…'; session = r.session ?? session; costLine(); }
      } finally { $('send').disabled = false; $('in').focus(); }
    }
    $('send').onclick = send;
    $('in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
    $('clear').onclick = async () => { if (confirm(T.chatClearAsk)) { await hsinChat.clear(); load(); } };
    $('setup').onclick = () => hsinChat.settings();
    window.addEventListener('focus', () => { if (!$('send').disabled && !$('in').value) load(); });   // settings may have changed meanwhile
    load().then(() => $('in').focus());
  </script>
</body>
</html>
